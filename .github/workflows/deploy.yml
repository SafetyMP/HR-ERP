# Validate the packaged application, then publish only the synthetic static demo.
# Vercel Git deployments are retired; see docs/operations/package-and-pages.md.
name: Main validation and demo

on:
  push:
    branches: [main, master]

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    secrets: inherit
    uses: ./.github/workflows/reusable-ci.yml

  qa:
    secrets: inherit
    uses: ./.github/workflows/reusable-qa.yml

  demo:
    needs: [ci, qa]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo-pages.yml
    with:
      publish: true
