name: Validate and optionally publish HR demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'src/lib/navigation/**'
      - 'src/components/ui/**'
      - 'src/app/globals.css'
      - 'scripts/serve-static-demo.mjs'
      - 'tests/demo/**'
      - 'playwright.demo.config.ts'
      - 'package*.json'
      - 'vendor/**'
      - 'tests/unit/security/**'
      - 'tests/unit/auth/neon-sdk-compatibility.test.ts'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated synthetic demo to GitHub Pages'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: hr-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx eslint demo src/lib/navigation/role-nav.ts scripts/serve-static-demo.mjs tests/demo playwright.demo.config.ts
      - run: npm run demo:typecheck
      - run: npm run test -- tests/unit/navigation/role-nav.test.ts tests/unit/security/deepmerge-vendor.test.ts tests/unit/auth/neon-sdk-compatibility.test.ts
      - run: npm run demo:build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run demo:test -- --workers=2
      - name: Retain demo browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hr-demo-browser-${{ github.sha }}
          path: |
            artifacts/navigation-redesign/
            test-results/demo/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo/out

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish validated demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
