name: Validate and publish Pages demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'src/lib/navigation/**'
      - 'src/components/ui/**'
      - 'src/app/globals.css'
      - 'scripts/serve-static-demo.mjs'
      - 'tests/demo/**'
      - 'playwright.demo.config.ts'
      - 'package*.json'
      - 'vendor/**'
      - 'tests/unit/security/**'
      - 'tests/unit/auth/neon-sdk-compatibility.test.ts'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: 'Publish the validated synthetic demo to GitHub Pages'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: hr-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      DEMO_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npx eslint demo src/lib/navigation/role-nav.ts scripts/serve-static-demo.mjs tests/demo playwright.demo.config.ts
      - run: npm run demo:typecheck
      - run: npm run test -- tests/unit/navigation/role-nav.test.ts tests/unit/security/deepmerge-vendor.test.ts tests/unit/auth/neon-sdk-compatibility.test.ts
      - run: npm run demo:build
      - name: Record demo source identity
        env:
          DEMO_SOURCE_SHA: ${{ github.sha }}
          DEMO_REPOSITORY: ${{ github.repository }}
          DEMO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { DEMO_SOURCE_SHA: commit, DEMO_REPOSITORY: repository, DEMO_RUN_URL: run } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('Invalid source commit');
          writeFileSync('demo/out/release.json', JSON.stringify({ commit, repository, run }) + '\n');
          NODE
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run demo:test -- --workers=2
      - name: Retain demo browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hr-demo-browser-${{ github.sha }}
          path: |
            artifacts/navigation-redesign/
            test-results/demo/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: demo/out

  deploy:
    if: github.event_name == 'push' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an obsolete source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$REPOSITORY/commits/$SOURCE_BRANCH" --jq .sha)"
          test "$current" = "$SOURCE_SHA"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish validated demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify-live:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure hosted browser target
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const url = new URL(process.env.PAGE_URL);
          appendFileSync(process.env.GITHUB_ENV, `DEMO_ORIGIN=${url.origin}\nDEMO_BASE_PATH=${url.pathname.replace(/\/$/, '')}\n`);
          NODE
      - name: Verify live source identity
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.DEMO_ORIGIN}${process.env.DEMO_BASE_PATH}/release.json`;
          let verified = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(`${url}?commit=${process.env.EXPECTED_SHA}`, { cache: 'no-store' });
            if (response.ok && (await response.json()).commit === process.env.EXPECTED_SHA) {
              verified = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) throw new Error('Pages is not serving the expected source commit');
          NODE
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run demo:test -- --workers=2
      - name: Retain hosted demo evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hr-demo-live-${{ github.sha }}
          path: |
            artifacts/navigation-redesign/
            test-results/demo/
          if-no-files-found: ignore
