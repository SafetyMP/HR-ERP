name: Publish container image

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing GitHub Release tag, e.g. v2.15.0."
        required: true
        type: string
      version:
        description: "Package version without the v prefix."
        required: true
        type: string
      sha:
        description: "Exact released commit (40 hexadecimal characters)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag, e.g. v2.15.0."
        required: true
        type: string
      version:
        description: "Package version without the v prefix."
        required: true
        type: string
      sha:
        description: "Exact released commit (40 hexadecimal characters)."
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Serialize release/manual callers from latest-tag validation through push.
    # A slower older build must not overwrite latest after a newer release build.
    concurrency:
      group: container-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load the validator from the protected workflow branch, not the input SHA.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify released source and package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-container.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Repo lower-case for GHCR
        id: repo
        run: echo "image=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Sign container image digest
        env:
          COSIGN_YES: true
          IMAGE_REF: ghcr.io/${{ steps.repo.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"
